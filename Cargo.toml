[package]
name = "tvgames"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.5"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
keyvalues-serde = "0.2.4"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rusty-leveldb = "4.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
tempfile = "3.27.0"
tiny_http = "0.12.0"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
] }
